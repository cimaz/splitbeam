# Builds SplitBeam for Linux, Windows and macOS when a version tag (v1.2.3) is pushed, then publishes a GitHub
# release with the changelog notes and the packages attached. Can also be run by hand for an existing tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.4.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            build: npx electron-builder --linux deb AppImage --publish never
            files: |
              dist/*.deb
              dist/*.AppImage
          - name: Windows
            os: windows-latest
            build: npx electron-builder --win nsis portable --x64 --publish never
            files: dist/*.exe
          - name: macOS
            os: macos-latest
            build: npx electron-builder --mac dmg --x64 --arm64 --publish never
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build packages
        shell: bash
        run: ${{ matrix.build }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: node scripts/changelog.js notes "$TAG" > notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l packages
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" packages/* --clobber
          else
            gh release create "$TAG" packages/* --verify-tag --title "SplitBeam ${TAG#v}" --notes-file notes.md
          fi
