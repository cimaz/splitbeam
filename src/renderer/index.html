<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>SplitBeam</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="update-bar" role="status" hidden>
      <span class="update-text"></span>
      <button class="update-download primary">Download</button>
      <button class="update-notes">Release notes</button>
      <button class="update-skip">Skip this version</button>
      <button class="update-close" title="Hide until next start">&#215;</button>
    </div>

    <main class="panes">
      <aside class="sidebar">
        <div class="sidebar-head">
          <span>Favorites</span>
          <button class="fav-add" title="Add current folder to favorites (Ctrl+D)">+</button>
        </div>
        <ul class="favorites side-list"></ul>
        <div class="sidebar-head section">
          <span>Network</span>
          <button class="net-add" title="Add SFTP server">+</button>
        </div>
        <ul class="network side-list"></ul>
      </aside>
      <div class="divider" aria-hidden="true"></div>
      <section class="pane" id="pane-left"></section>
      <div class="divider" aria-hidden="true"></div>
      <section class="pane" id="pane-right"></section>
    </main>

    <footer class="keybar">
      <button data-action="rename"><kbd>F2</kbd>Rename</button>
      <button data-action="open"><kbd>F3</kbd>Open</button>
      <button data-action="copy"><kbd>F5</kbd>Copy</button>
      <button data-action="move"><kbd>F6</kbd>Move</button>
      <button data-action="mkdir"><kbd>F7</kbd>New folder</button>
      <button data-action="trash"><kbd>F8</kbd>Trash</button>
      <button data-action="hidden"><kbd>Ctrl+H</kbd>Hidden</button>
      <button data-action="swap"><kbd>Ctrl+U</kbd>Swap</button>
      <button data-action="mirror"><kbd>Ctrl+M</kbd>Mirror</button>
      <button data-action="sync"><kbd>Ctrl+S</kbd>Sync</button>
    </footer>

    <template id="pane-template">
      <div class="pathbar">
        <button class="up" title="Parent folder (Backspace)">&#8593;</button>
        <button class="home" title="Home folder (Ctrl+Home)">&#8962;</button>
        <input class="path" spellcheck="false" />
      </div>
      <div class="colhead">
        <button data-sort="name">Name</button>
        <button data-sort="size">Size</button>
        <button data-sort="mtime">Modified</button>
      </div>
      <div class="list" tabindex="0"></div>
      <div class="status"></div>
    </template>

    <dialog id="dialog">
      <form method="dialog">
        <p class="dlg-message"></p>
        <input class="dlg-input" spellcheck="false" />
        <menu class="dlg-buttons"></menu>
      </form>
    </dialog>

    <dialog id="sync-dialog" class="sync-dialog">
      <h2>Sync folders</h2>
      <fieldset class="sync-direction">
        <legend>Direction</legend>
        <label>
          <input type="radio" name="sync-direction" value="left" />
          <span><strong>Left &#8594; Right</strong><small data-paths="left"></small></span>
        </label>
        <label>
          <input type="radio" name="sync-direction" value="right" />
          <span><strong>Right &#8594; Left</strong><small data-paths="right"></small></span>
        </label>
      </fieldset>
      <label class="sync-option">
        <input type="checkbox" class="sync-delete" />
        Move items that exist only in the target to the trash (make the target an exact copy)
      </label>
      <p class="sync-summary"></p>
      <ul class="sync-plan"></ul>
      <div class="sync-progress" hidden>
        <progress value="0" max="1"></progress>
        <div class="sync-current"></div>
      </div>
      <menu class="dlg-buttons">
        <button class="sync-cancel">Cancel</button>
        <button class="sync-run primary">Sync</button>
      </menu>
    </dialog>

    <dialog id="conn-dialog" class="conn-dialog">
      <form method="dialog">
        <h2 class="conn-title">Add SFTP server</h2>
        <div class="conn-grid">
          <label class="wide">Name <input name="name" placeholder="Same as host if empty" spellcheck="false" /></label>
          <label class="host">Host <input name="host" required placeholder="example.com" spellcheck="false" /></label>
          <label class="port">Port <input name="port" type="number" min="1" max="65535" value="22" required /></label>
          <label class="wide">Username <input name="username" required spellcheck="false" /></label>
          <label class="wide">
            Sign in with
            <select name="auth">
              <option value="password">Password (asked when connecting)</option>
              <option value="key">SSH key file</option>
              <option value="agent">SSH agent</option>
            </select>
          </label>
          <label class="wide key-row">
            Private key file
            <span class="with-button">
              <input name="keyPath" placeholder="~/.ssh/id_ed25519" spellcheck="false" />
              <button type="button" class="key-browse">Browse&#8230;</button>
            </span>
          </label>
          <label class="wide">Start in folder <input name="remotePath" placeholder="Home folder if empty" spellcheck="false" /></label>
        </div>
        <menu class="dlg-buttons">
          <button value="save" class="primary">Save</button>
          <button value="" formnovalidate>Cancel</button>
        </menu>
      </form>
    </dialog>

    <script src="renderer.js"></script>
  </body>
</html>
